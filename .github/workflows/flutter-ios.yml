name: Build experimental iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - 'ios/**'
    paths:
      - '.github/workflows/flutter-ios.yml'
      - '.github/workflows/bridge.yml'
      - 'Cargo.*'
      - 'build.rs'
      - 'src/**'
      - 'libs/**'
      - 'res/vcpkg*/**'
      - 'vcpkg.json'
      - 'flutter/**'
      - 'scripts/*ios*'
      - 'docs/ios-installation.md'
  workflow_call:
    inputs:
      reuse-generated-bridge:
        type: boolean
        default: false
      publish-release:
        type: boolean
        default: false
      upload-tag:
        type: string
        default: ''

concurrency:
  group: subnetdesk-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.1"
  RUST_VERSION: "1.82"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    if: ${{ !inputs.reuse-generated-bridge }}
    uses: ./.github/workflows/bridge.yml

  build-ios:
    if: ${{ always() && !cancelled() && (needs.generate-bridge.result == 'success' || needs.generate-bridge.result == 'skipped') }}
    name: Build experimental unsigned iOS IPA
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-apple-ios,
              os: macos-latest,
              vcpkg-triplet: arm64-ios,
            }
    env:
      PUBLISH_RELEASE: ${{ inputs.publish-release || false }}
      TAG_NAME: ${{ inputs.upload-tag }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          brew install nasm yasm
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Read package version and native dependency baseline
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path
          version = re.search(r'^version = "([0-9.]+)"$', Path('Cargo.toml').read_text(), re.MULTILINE).group(1)
          baseline = json.loads(Path('vcpkg.json').read_text())['vcpkg-configuration']['default-registry']['baseline']
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"VERSION={version}\nVCPKG_COMMIT_ID={baseline}\n")
          PYTHON

      - name: Test unsigned iOS packaging
        run: python3 -m unittest discover -s scripts -p test_package_unsigned_ios.py

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: ${{ matrix.job.target }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build SubnetDesk lib
        env:
          # Keep this out of vcpkg's macOS host-tool builds.
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: Upload liblibrustdesk.a Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liblibrustdesk.a
          path: target/aarch64-apple-ios/release/liblibrustdesk.a

      - name: Build unsigned iOS app
        shell: bash
        working-directory: flutter
        run: |
          flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="${{ github.run_number }}"

      - name: Package experimental unsigned IPA
        run: |
          bash scripts/package_unsigned_ios.sh flutter/build/ios/iphoneos/Runner.app "ios-release/subnetdesk-${VERSION}-ios-arm64-unsigned.ipa"
          cp docs/ios-installation.md ios-release/subnetdesk-ios-installation.md

      - name: Upload unsigned iOS package and installation guide
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subnetdesk-ios-arm64-unsigned
          path: ios-release/*
          if-no-files-found: error

      - name: Publish unsigned iOS package and installation guide
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/upload_release_asset_with_retry.sh "$TAG_NAME" "ios-release/subnetdesk-${VERSION}-ios-arm64-unsigned.ipa"
          bash scripts/upload_release_asset_with_retry.sh "$TAG_NAME" ios-release/subnetdesk-ios-installation.md
